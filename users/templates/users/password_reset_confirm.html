{% extends "main/base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2>Установите новый пароль</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить пароль</button>
    </form>
</div>
{% endblock %}
