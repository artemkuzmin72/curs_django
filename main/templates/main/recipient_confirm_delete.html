{% extends "main/base.html" %}
{% block title %}Удаление получателя{% endblock %}
{% block content %}

<div class="card shadow-sm border-danger">
  <div class="card-header bg-danger text-white">
    Подтверждение удаления
  </div>
  <div class="card-body">
    <p>Вы действительно хотите удалить <strong>{{ object.full_name }}</strong> ({{ object.email }})?</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Удалить</button>
      <a href="{% url 'recipient_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
  </div>
</div>

{% endblock %}
