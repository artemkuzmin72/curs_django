{% extends "main/base.html" %}
{% block title %}Удаление сообщения{% endblock %}
{% block content %}
<div class="card shadow-sm border-danger">
  <div class="card-header bg-danger text-white">Подтверждение удаления</div>
  <div class="card-body">
    <p>Вы уверены, что хотите удалить сообщение <strong>«{{ object.subject }}»</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Удалить</button>
      <a href="{% url 'message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
